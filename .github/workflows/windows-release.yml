name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Windows build to
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the desktop application
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name InvokerHandSigns
          --collect-all mediapipe
          --collect-all flet
          --collect-all cv2
          app.py

      - name: Package the release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/InvokerHandSigns.exe package/InvokerHandSigns.exe
          Copy-Item config.example.json package/config.example.json
          Copy-Item README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath InvokerHandSigns-windows-x64.zip -Force

      - name: Upload build to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: InvokerHandSigns-windows-x64.zip
          fail_on_unmatched_files: true
